worker_processes  auto;
events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Cloudflare-friendly forwarded headers
        real_ip_header CF-Connecting-IP;
        set_real_ip_from 0.0.0.0/0;

        # Security headers (mild — Cloudflare adds the rest)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Static asset caching
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # OAuth callback — serve the index of /callback/
        location = /callback {
            return 301 /callback/;
        }
        location /callback/ {
            try_files $uri $uri/ /callback/index.html;
        }

        # HTML pages — short cache
        location ~ \.html$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300";
            try_files $uri =404;
        }

        # Fallback
        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        # Health check (used by docker compose / cloudflared)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Hide hidden files
        location ~ /\. { deny all; }
    }
}
