<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouLikeIt - TikTok Authorization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #16213e; border-radius: 16px; padding: 40px; max-width: 500px; text-align: center; }
        h1 { color: #5cb85c; margin-bottom: 15px; }
        .code { background: #0d1b2a; border: 1px solid #5cb85c40; border-radius: 8px; padding: 15px;
                font-family: monospace; font-size: 1.1em; word-break: break-all; margin: 20px 0;
                user-select: all; cursor: pointer; }
        .hint { color: #888; font-size: 0.85em; margin-top: 10px; }
        .error { color: #d9534f; }
        .error h1 { color: #d9534f; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <p>Processing...</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const card = document.getElementById('card');

        if (code) {
            card.innerHTML = `
                <h1>Authorized!</h1>
                <p>Copy this code and paste it in your terminal:</p>
                <div class="code" onclick="navigator.clipboard.writeText('${code}')">${code}</div>
                <p class="hint">Click the code to copy. Then paste in the terminal where ex36 is running.</p>
            `;
        } else if (error) {
            card.innerHTML = `<div class="error"><h1>Error</h1><p>${error}: ${params.get('error_description') || ''}</p></div>`;
        } else {
            card.innerHTML = `<div class="error"><h1>No code received</h1><p>Try authorizing again.</p></div>`;
        }
    </script>
</body>
</html>
