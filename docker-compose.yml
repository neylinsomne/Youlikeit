services:
  ytlab:
    build: .
    container_name: ytlab
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - e:/movies:/movies
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - FISH_SPEECH_URL=http://fish-speech:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    command: ["bash", "-lc", "tail -f /dev/null"]

  dashboard:
    build: .
    container_name: yt-dashboard
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: ["python", "src/main.py", "ex28", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped

  api:
    build: .
    container_name: yt-api
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: ["python", "src/main.py", "ex29", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped

  frontend:
    build: .
    container_name: yt-frontend
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: ["python", "src/main.py", "ex30", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: yt-qbit
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
      - WEBUI_PORT=8090
    volumes:
      - e:/movies:/downloads
      - qbit-config:/config
    ports:
      - "8090:8090"     # Web UI
      - "6881:6881"     # Torrent port
      - "6881:6881/udp"
    restart: unless-stopped

  # ─── Clapshot: Video review & approval ───
  clapshot:
    image: elonen/clapshot:latest-demo-htadmin
    container_name: yt-clapshot
    ports:
      - "8085:80"
    volumes:
      - ./data/clapshot:/mnt/clapshot-data/data
    environment:
      - CLAPSHOT_SERVER__URL_BASE=http://localhost:8085/
      - CLAPSHOT_SERVER__BITRATE=2.5
      - CLAPSHOT_SERVER__WORKERS=0
      - CLAPSHOT_SERVER__POLL=5
      - CLAPSHOT_APP_TITLE=YouLikeIt Review
    restart: unless-stopped

  # ─── Twick: Video editor + render server ───
  twick:
    build:
      context: ./twick-render-server
      dockerfile: Dockerfile
    container_name: yt-twick
    ports:
      - "3100:3000"
    env_file: .env
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    environment:
      - DISABLE_TELEMETRY=true
    restart: unless-stopped

  # Fish Speech TTS - descomentar cuando lo necesites
