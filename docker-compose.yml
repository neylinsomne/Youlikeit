services:
  ytlab:
    build: .
    container_name: ytlab
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    command: ["bash", "-lc", "tail -f /dev/null"]
