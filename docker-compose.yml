# YouLikeIt - Pipeline
# Single image shared across services to save disk space (~2GB total vs ~12GB before)
#
# The production studio (API src/apps/studio + frontend-react) is NOT a compose service:
# it runs natively on 127.0.0.1 via scripts/ops/studio.ps1. The legacy ex29 API and the
# old frontend container were removed (unauthenticated, listened on 0.0.0.0).

services:
  # Main pipeline worker (GPU)
  ytlab:
    build: .
    image: youlikeit:latest
    container_name: ytlab
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    command: ["bash", "-lc", "tail -f /dev/null"]

  # Fish Speech TTS (GPU)
  fish-speech:
    build:
      context: .
      dockerfile: Dockerfile.fish
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    image: youlikeit-fish:latest
    container_name: yt-fish-speech
    ports:
      - "7860:7860"
      - "8080:8080"
    volumes:
      - fish-speech-models:/app/checkpoints
      - ./outputs/voice_samples/references:/app/references
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DEVICE=cuda
      - TORCHAUDIO_BACKEND=soundfile
    command: []
    restart: unless-stopped

volumes:
  fish-speech-models:
