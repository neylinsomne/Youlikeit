services:
  ytlab:
    build: .
    container_name: ytlab
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - FISH_SPEECH_URL=http://fish-speech:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    depends_on:
      - fish-speech
    ports:
      - "8000:8000"   # ex28 dashboard
      - "8001:8001"   # ex29 API REST
      - "8002:8002"   # ex30 frontend
    command: ["bash", "-lc", "tail -f /dev/null"]

  fish-speech:
    image: fishaudio/fish-speech:latest
    container_name: fish-speech
    ports:
      - "8080:8080"
    volumes:
      - fish-speech-models:/root/.cache/fish-speech
      - ./data/voices:/voices
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "-m", "fish_speech.serve", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  fish-speech-models:
