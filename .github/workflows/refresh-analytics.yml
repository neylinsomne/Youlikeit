name: Refresh Plausible Analytics

# Capa de "Monitoring" del flujo MLOps (Sculley): mantiene
# `plausible_pageviews` / `plausible_events` frescas leyendo la Stats API del
# Plausible self-hosted, y deja el JSON como artifact para inspección.
#
# No usa LLM, no toca render. Sin costo (Stats API propia).
# Ver: docs/architecture/MLOPS_FLOW.md + docs/agents/ANALYTICS_AGENT.md
#
# NOTA: el Plausible self-hosted vive detrás de Cloudflare Tunnel. El runner
# de GitHub debe poder alcanzar https://analytics.vara-alta.lat (público vía
# Tunnel). Si la instancia está caída, el job degrada con warning, no rompe.

on:
  schedule:
    # Cada 4h: fetch + persist (barrido de 7d)
    - cron: '15 */4 * * *'
    # Diario 05:00 UTC: agregación de 30d
    - cron: '0 5 * * *'

  workflow_dispatch:
    inputs:
      period:
        description: "Periodo Plausible (7d, 30d, month, ...)"
        default: "7d"
      persist:
        description: "Persistir a tablas plausible_*"
        type: boolean
        default: true

jobs:
  refresh:
    name: Fetch + persist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: analytics-${{ github.run_id }}
          restore-keys: |
            analytics-

      - name: Decide period
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "period=30d" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.period }}" ]; then
            echo "period=${{ inputs.period }}" >> "$GITHUB_OUTPUT"
          else
            echo "period=7d" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Plausible stats
        env:
          PLAUSIBLE_BASE_URL: ${{ secrets.PLAUSIBLE_BASE_URL }}
          PLAUSIBLE_API_KEY:  ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID:  ${{ secrets.PLAUSIBLE_SITE_ID }}
        run: |
          mkdir -p out
          set +e
          python scripts/analytics/fetch_plausible_stats.py \
            --period "${{ steps.cfg.outputs.period }}" --persist --json \
            > out/analytics_report.json
          RC=$?
          set -e
          cat out/analytics_report.json || true
          if [ "$RC" -ne 0 ]; then
            echo "::warning::fetch_plausible_stats salió con $RC (instancia caída o sin API key)"
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-report-${{ github.run_id }}
          path: out/analytics_report.json
          retention-days: 14

      - name: Save data cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data
          key: analytics-${{ github.run_id }}
