# Plausible Analytics — stack self-hosted aislado del pipeline principal.
#
# Owner: docs/agents/ANALYTICS_AGENT.md
# Por qué un compose separado: Plausible no comparte imagen ni red con el
# pipeline GPU (docker-compose.yml). Mantenerlo aislado permite levantarlo /
# tumbarlo sin tocar render ni la API REST.
#
# Servicios:
#   plausible_db         → Postgres 16  (metadata: sitios, usuarios, settings)
#   plausible_events_db  → Clickhouse 24 (event store: pageviews, custom events)
#   plausible            → app Phoenix (UI + ingest + Stats API en :8000)
#
# Arranque:
#   cp .env.plausible.example .env.plausible   # y rellenar SECRET_KEY_BASE
#   docker compose -f docker-compose.plausible.yml up -d
#   docker compose -f docker-compose.plausible.yml ps
#
# Verificación:
#   curl http://localhost:8000/api/health      # local
#   curl https://analytics.vara-alta.lat/api/health   # vía Cloudflare Tunnel
#
# Versiones pineadas al último release estable de Plausible CE para evitar
# el drift Clickhouse 24.x ↔ migraciones (ver § "Si te bloqueas" en el prompt).

services:
  plausible_db:
    image: postgres:16-alpine
    container_name: plausible_db
    restart: unless-stopped
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-plausible}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.plausible}
      - POSTGRES_DB=${POSTGRES_DB:-plausible_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plausible} -d ${POSTGRES_DB:-plausible_db}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: plausible_events_db
    restart: unless-stopped
    volumes:
      - plausible_events_db_data:/var/lib/clickhouse
      - ./infra/plausible/clickhouse/config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./infra/plausible/clickhouse/user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.4
    container_name: plausible
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    ports:
      # Solo bind a localhost: la exposición pública la hace Cloudflare Tunnel,
      # nunca el puerto directo (evita saltarse el Tunnel + WAF).
      - "127.0.0.1:8000:8000"
    env_file: .env.plausible
    environment:
      - BASE_URL=${BASE_URL:?set BASE_URL in .env.plausible}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?generate with openssl rand -base64 48}
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-invite_only}
      - DATABASE_URL=${DATABASE_URL:-postgres://plausible:${POSTGRES_PASSWORD}@plausible_db:5432/plausible_db}
      - CLICKHOUSE_DATABASE_URL=${CLICKHOUSE_DATABASE_URL:-http://plausible_events_db:8123/plausible_events_db}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  plausible_db_data:
  plausible_events_db_data:
